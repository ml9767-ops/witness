name: SBOMit Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sbom:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Build under SBOMit
        uses: Uk-jake/sbomit-pipeline-runner@main
        with:
          build-command: |
            make build
          sbom-format: spdx23
          use-syft: true
